version: '3'
services:
  gnps2-annex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gnps2-annex
    volumes:
      - ./logs:/app/logs:rw
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /app/run_server.sh
    environment:
      VIRTUAL_HOST: annex.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: annex.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com
    deploy:
      resources:
        limits:
          memory: 8000M

networks:
  nginx-net:
    external:
      name: nginx-net